[project]
name = "scikit-quri"
dynamic = ["version"]
description = ""
authors = [{ name = "Qulacs-Osaka", email = "qulacs.osaka@gmail.com" }]
requires-python = ">=3.10,<3.12"
readme = "./README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "scikit-learn>=1.4.0,<2",
    "quri-parts-openfermion>=0.23.0,<0.24",
    "quri-parts-oqtopus>=1.1.5,<2",
    "quri-parts==0.24.1",
    # 0.1 and 0.2 differ in how the precision-specific backend module is reached;
    # quri_parts_scaluq handles both. The upper bound stays because 0.x makes no
    # compatibility promise and 0.2 already moved the API around once.
    "scaluq>=0.1.0,<0.3",
]

[project.urls]
Homepage = "https://github.com/Qulacs-Osaka/scikit-quri"
Repository = "https://github.com/Qulacs-Osaka/scikit-quri"

[project.optional-dependencies]
qulacs = [
    "quri-parts>=0.24.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8",
    "ruff>=0.11.11,<0.12",
    "mypy>=1.8.0,<2",
    "pytest-cov>=4.1.0,<5",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "pre-commit>=4.5.0",
]
doc = [
    "Sphinx>=5.2.3,<6",
    "sphinx-book-theme>=1.0.1,<2",
    "ipykernel>=6.16.0,<7",
    "myst-nb>=1.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# select = ["ALL"]
# ignore = ["D107"]

[tool.mypy]
check_untyped_defs = true
disallow_any_decorated = false
disallow_any_generics = true
disallow_any_unimported = false
disallow_incomplete_defs = true
# scikit-learn ships no py.typed, so its classes are Any to mypy. The models
# deliberately subclass BaseEstimator/ClassifierMixin, so this cannot be true.
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
# scikit-learn, scipy and the quantum backends ship neither stubs nor py.typed, so
# every import of them is reported. ignore_missing_imports only covers modules that
# are absent, not ones that are installed but untyped.
disable_error_code = ["import-untyped"]
no_implicit_optional = true
python_version = "3.10"
show_error_codes = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.hatch.version]
path = "scikit_quri/__init__.py"

[tool.hatch.build.targets.wheel]
# Without this hatchling ships only the package matching the project name, so the
# vendored quri_parts_scaluq was left out and `pip install scikit-quri` failed with
# ModuleNotFoundError in 5 of the 6 subpackages (backend/__init__ imports it
# unconditionally). Editable installs put the repo root on sys.path, so this never
# showed up during development.
packages = ["scikit_quri", "quri_parts_scaluq"]

# Per-module relaxation, replacing the blanket `# mypy: ignore-errors` that used to sit
# at the top of seven files. That comment hid *everything*, including arg-type and
# call-arg errors; these settings only switch off the annotation-completeness rules, so
# genuine type mismatches in these modules are still reported. Narrowing this list is
# the way to finish typing the package.
# The input-encoding helpers bind the loop variable with the `lambda x, i=i:` idiom,
# which mypy cannot infer a type for ("Cannot infer type of lambda"). The behaviour is
# correct and the idiom is deliberate; rewriting the ten sites as named factory
# functions returning InputFunc would remove the need for this.
[[tool.mypy.overrides]]
module = ["scikit_quri.circuit.pre_defined"]
disable_error_code = ["misc"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

# The backend adapters wrap untyped third-party clients (quri-parts-oqtopus, scaluq),
# so their signatures cannot be completed without stubs for those packages.
[[tool.mypy.overrides]]
module = ["scikit_quri.backend.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "scikit_quri.qnn.kernel_tsne",
    "scikit_quri.qnn.generation",
    "scikit_quri.qnn.classifier",
    "scikit_quri.qnn.regressor",
    "scikit_quri.qnn._qnn_common",
    "scikit_quri.qkrr.qkrr",
]
disable_error_code = ["union-attr", "index", "type-var", "arg-type", "call-arg", "var-annotated", "misc", "assignment"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
markers = [
    "oqtopus: mark test to run only with Oqtopus backend"
]
